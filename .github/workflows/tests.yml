# TJKEY 验证流水线
#
# 以子进程方式运行全部模块自测与分轮验证脚本（tests/test_suites.py）。
# 项目主要面向 Windows（OpenInputDesktop 系统锁屏探测、ICO 图标等），
# 因此以 Windows 为主力环境，同时用 Linux 离屏 Qt 验证跨平台兼容。

name: tests

on:
  push:
  pull_request:

jobs:
  tests:
    env:
      PYTHONIOENCODING: utf-8
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: 安装 Linux 离屏 Qt 依赖
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt "pytest>=8.0.0"

      - name: 运行全部验证
        run: python -m pytest tests -v
